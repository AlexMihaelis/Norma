<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark">N</span>
    <span class="brand-name">Norma</span>
  </a>

  @if (auth.signedIn()) {
    <nav>
      <a routerLink="/diary" routerLinkActive="active">Дневник</a>
      <a routerLink="/weight" routerLinkActive="active">Вес</a>
      <a routerLink="/stats" routerLinkActive="active">Статистика</a>
      <a routerLink="/profile" routerLinkActive="active">Профиль</a>
    </nav>

    <span class="spacer"></span>

    <div class="account-block">
      <button
        type="button"
        class="account-button"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu($event)"
      >
        @if (account.avatarDataUrl(); as image) {
          <img class="avatar" [src]="image" alt="Аватар" />
        } @else {
          <span class="avatar initials">{{ account.initials() }}</span>
        }
        <span class="account-name">{{ account.displayName() }}</span>
      </button>

      @if (menuOpen()) {
        <div class="account-menu" (click)="$event.stopPropagation()">
          <a routerLink="/profile" (click)="closeMenu()">Профиль</a>
          <button type="button" class="menu-item" (click)="signOut()">Выйти</button>
        </div>
      }
    </div>
  }
</header>

<main class="page">
  <router-outlet />
</main>
