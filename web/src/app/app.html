@if (auth.signedIn()) {
  <div class="shell">
    <aside class="sidebar">
      <a class="sidebar-brand" routerLink="/" aria-label="На главную">
        <app-logo size="sm" />
      </a>

      <nav class="sidebar-nav">
        @for (item of nav; track item.path) {
          <a
            class="nav-item"
            [routerLink]="item.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact === true }"
          >
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path [attr.d]="item.icon" />
            </svg>
            <span class="nav-title">{{ item.title }}</span>
          </a>
        }

        <button type="button" class="nav-item" disabled title="Скоро">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="settingsIcon" />
          </svg>
          <span class="nav-title">Настройки</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button
          type="button"
          class="icon-button"
          disabled
          title="Темная тема - позже"
          aria-label="Светлая тема"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="sunIcon" />
          </svg>
        </button>

        <button
          type="button"
          class="icon-button"
          disabled
          title="Темная тема - позже"
          aria-label="Темная тема"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="moonIcon" />
          </svg>
        </button>

        <button type="button" class="icon-button" (click)="signOut()" aria-label="Выйти" title="Выйти">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="logoutIcon" />
          </svg>
        </button>
      </div>
    </aside>

    <div class="content">
      <header class="shell-header">
        <span class="header-date">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="calendarIcon" />
          </svg>
          {{ todayLabel }}
        </span>

        <span class="spacer"></span>

        <button type="button" class="icon-button bell" disabled title="Уведомления скоро" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path [attr.d]="bellIcon" />
          </svg>
          <span class="bell-dot"></span>
        </button>

        <div class="account-block">
          <button
            type="button"
            class="account-button"
            [attr.aria-expanded]="menuOpen()"
            (click)="toggleMenu($event)"
            aria-label="Меню аккаунта"
          >
            @if (account.avatarDataUrl(); as image) {
              <img class="avatar" [src]="image" alt="Аватар" />
            } @else {
              <span class="avatar initials">{{ account.initials() }}</span>
            }
            <svg
              class="account-chevron"
              [class.open]="menuOpen()"
              viewBox="0 0 12 8"
              width="12"
              height="8"
              aria-hidden="true"
            >
              <path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="account-menu" (click)="$event.stopPropagation()">
              <span class="menu-caption">{{ account.displayName() }}</span>
              <a routerLink="/profile" (click)="closeMenu()">Профиль</a>
              <button type="button" class="menu-item" (click)="signOut()">Выйти</button>
            </div>
          }
        </div>
      </header>

      <main class="page">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <main class="auth-shell">
    <router-outlet />
  </main>
}
