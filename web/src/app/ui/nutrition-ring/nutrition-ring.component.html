<svg viewBox="0 0 108 108" aria-hidden="true">
  <circle class="track" cx="54" cy="54" [attr.r]="radius" />

  @for (arc of arcs(); track arc.color) {
    <circle
      class="arc"
      cx="54"
      cy="54"
      [attr.r]="radius"
      [attr.stroke]="arc.color"
      [attr.stroke-dasharray]="arc.dash"
      [attr.stroke-dashoffset]="arc.offset"
      transform="rotate(-90 54 54)"
    />
  }
</svg>

<div class="center">
  <strong>{{ kcalText() }}</strong>
  <span>ккал</span>
</div>
