<section class="card auth">
  <h1 [class.accent]="isRegister()">{{ isRegister() ? 'Регистрация' : 'Вход' }}</h1>
  <p class="muted">Норма - дневник питания, веса и активности.</p>

  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    [class.swap-a]="swap() % 2 === 0"
    [class.swap-b]="swap() % 2 === 1"
  >
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
    </label>

    <label>
      Пароль
      <span class="password">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          [attr.autocomplete]="isRegister() ? 'new-password' : 'current-password'"
          placeholder="не короче 6 символов"
        />
        <button
          type="button"
          class="eye"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Скрыть пароль' : 'Показать пароль'"
          [attr.title]="showPassword() ? 'Скрыть пароль' : 'Показать пароль'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M2 4.3 3.3 3l17.7 17.7-1.3 1.3-3.2-3.2A10.3 10.3 0 0 1 12 20C6.5 20 2.3 16.1 1 12c.6-1.9 1.9-3.6 3.6-4.9L2 4.3Zm6.2 6.2a4 4 0 0 0 5.3 5.3l-5.3-5.3ZM12 4c5.5 0 9.7 3.9 11 8-1.2 3.6-4.5 6.9-8.9 7.8l-2-2A4 4 0 0 0 8.2 9.4L6.6 7.8A12 12 0 0 1 12 4Z"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="currentColor"
                d="M12 5c5.5 0 9.7 3.9 11 7-1.3 3.1-5.5 7-11 7S2.3 15.1 1 12c1.3-3.1 5.5-7 11-7Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"
              />
            </svg>
          }
        </button>
      </span>
    </label>

    @if (error(); as message) {
      <p class="error">{{ message }}</p>
    }

    <button type="submit" class="submit" [disabled]="busy()">
      {{ busy() ? 'Подождите…' : isRegister() ? 'Создать аккаунт' : 'Войти' }}
    </button>
  </form>

  <div class="switch">
    <span class="muted">{{ isRegister() ? 'Уже есть аккаунт?' : 'Ещё не зарегистрировались?' }}</span>
    <button type="button" class="link" (click)="toggleMode()">
      {{ isRegister() ? 'Войти' : 'Зарегистрироваться' }}
    </button>
  </div>
</section>
